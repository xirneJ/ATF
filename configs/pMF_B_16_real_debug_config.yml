# Real-data debug config (B/16) for a single shared GPU.
#
# Purpose: verify that the finite-difference derivative gives the same training
# dynamics as exact JVP on REAL images (not synthetic noise).
#
# Data: an ImageFolder subset, e.g. created with
#   python scripts/prepare_imagenet_subset.py --src /data/imagenet \
#       --dst /data/imagenet_subset10 --num-classes 10
#
# Usage:
#   python main.py --workdir=<log_dir> --config=configs/load_config.py:pMF_B_16_real_debug

dataset:
    root: /home/xyds25/qiangchen/data/imagenet_subset10   # created by scripts/prepare_imagenet_subset.py
    synthetic: False
    synthetic_samples: 1024
    image_size: 256
    num_classes: 10                    # keep in sync with the subset
    num_workers: 4
    prefetch_factor: 2
    pin_memory: False
    use_flip: False

model:
    model_str: pmfDiT_B_16
    num_classes: 10
    cfg_beta: 1.0
    P_mean: 0.8
    P_std: 0.8
    noise_scale: 1.0

    lpips: False
    convnext: False

    cheb_order: 3
    deriv_mode: 'fd'        # 'fd' | 'jvp'
    fd_central: True
    fd_delta: 0.02          # TF32 matmul on GPU needs a larger delta
    reg_lambda: 0.0
    teacher_ema: False

training:
    log_per_step: 50
    checkpoint_per_epoch: 1
    num_epochs: 1
    batch_size: 4
    learning_rate: 0.001
    warmup_epochs: 0
    adam_b2: 0.95
    ema_type: 'edm'
    ema_val: [2000]
    sample_per_epoch: 1
    fid_per_epoch: 100      # FID disabled (cache_ref empty)
    seed: 42
    grad_clip_norm: 1.0

fid:
    device_batch_size: 4
    num_samples: 16
    cache_ref: ''

sampling:
    num_steps: 1
    omega: 8.5
    t_min: 0.1
    t_max: 0.7

logging:
    use_wandb: False
    wandb_project: 'YOUR PROJECT'
    wandb_entity: 'YOUR ENTITY'
    wandb_tags: []
    wandb_notes: ''

load_from: ''
