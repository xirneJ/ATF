# Evaluate a trained OUR-method checkpoint (Chebyshev K=3, t_cond=False) over a CFG sweep.
# Set `load_from` to e.g. runs/subset10_pilot_ours/checkpoint_50000, then:
#   python main.py --workdir=runs/eval_ours_50000_sweep \
#       --config=configs/load_config.py:fid/subset10_eval_cheb_sweep
# Purpose: check whether the pilot FID comparison at a fixed omega=8.5 was unfair,
# i.e. whether our method needs a different CFG scale.

dataset:
    root: /home/xyds25/qiangchen/data/imagenet_subset10_split
    synthetic: False
    synthetic_samples: 1024
    image_size: 256
    num_classes: 10
    num_workers: 4
    prefetch_factor: 2
    pin_memory: False
    use_flip: False

model:
    model_str: pmfDiT_B_16
    num_classes: 10
    cfg_beta: 1.0
    P_mean: 0.8
    P_std: 0.8
    noise_scale: 1.0
    lpips: False
    convnext: False
    cheb_order: 3
    t_cond: False
    deriv_mode: 'fd'
    fd_central: True
    fd_delta: 0.02
    reg_lambda: 0.0
    teacher_ema: False

training:
    log_per_step: 50
    checkpoint_per_epoch: 100
    num_epochs: 1
    batch_size: 2
    learning_rate: 0.001
    warmup_epochs: 0
    adam_b2: 0.95
    ema_type: 'edm'
    ema_val: [2000]
    sample_per_epoch: 100
    fid_per_epoch: 1
    seed: 42
    grad_clip_norm: 1.0

fid:
    device_batch_size: 8
    num_samples: 3000
    inception_batch_size: 32
    cache_ref: /home/xyds25/qiangchen/data/fid/subset10_ref.npz

sampling:
    num_steps: 1
    num_classes: 10
    emas: [2000]
    interval: [[0.1, 0.7]]
    omegas: [4.0, 6.0, 8.5, 10.0, 12.0]

logging:
    use_wandb: False
    wandb_project: 'YOUR PROJECT'
    wandb_entity: 'YOUR ENTITY'
    wandb_tags: []
    wandb_notes: ''

# >>> set this to the checkpoint to evaluate <<<
load_from: ''
eval_only: True
