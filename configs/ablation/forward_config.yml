# Ablation: forward difference instead of central difference (same delta=0.02).
# Stop at training.max_steps=2000 for a cheap run.

dataset:
    root: /home/xyds25/qiangchen/data/imagenet_subset10
    synthetic: False
    synthetic_samples: 1024
    image_size: 256
    num_classes: 10
    num_workers: 4
    prefetch_factor: 2
    pin_memory: False
    use_flip: False

model:
    model_str: pmfDiT_B_16
    num_classes: 10
    cfg_beta: 1.0
    P_mean: 0.8
    P_std: 0.8
    noise_scale: 1.0
    lpips: False
    convnext: False
    cheb_order: 3
    deriv_mode: 'fd'
    fd_central: False
    fd_delta: 0.02
    reg_lambda: 0.0
    teacher_ema: False

training:
    log_per_step: 50
    checkpoint_per_epoch: 1
    num_epochs: 1
    max_steps: 2000
    batch_size: 2
    learning_rate: 0.001
    warmup_epochs: 0
    adam_b2: 0.95
    ema_type: 'edm'
    ema_val: [2000]
    sample_per_epoch: 1
    fid_per_epoch: 100
    seed: 42
    grad_clip_norm: 1.0

fid:
    device_batch_size: 2
    num_samples: 16
    cache_ref: ''

sampling:
    num_steps: 1
    omega: 8.5
    t_min: 0.1
    t_max: 0.7

logging:
    use_wandb: False
    wandb_project: 'YOUR PROJECT'
    wandb_entity: 'YOUR ENTITY'
    wandb_tags: []
    wandb_notes: ''

load_from: ''
