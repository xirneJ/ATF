# Small-scale debug config for a single GPU (e.g. RTX 5090 32GB).
#
# Usage:
#   python main.py --workdir=<log_dir> --config=configs/load_config.py:pMF_B_16_debug
#
# Notes:
#   - single `dataset:` block on purpose: the upstream configs had a duplicated
#     `dataset:` key, so `root` was silently dropped by PyYAML.
#   - FID is disabled by leaving `fid.cache_ref` empty.
#   - auxiliary perceptual losses are disabled for the first smoke run
#     (they need `transformers` + HuggingFace weights and more memory).
#   - on a shared GPU export XLA_PYTHON_CLIENT_MEM_FRACTION (or disable
#     preallocation) and lower `training.batch_size` if you hit OOM.

dataset:
    root: /path/to/imagenet        # only used when synthetic: False
    synthetic: True                # deterministic random images; no ImageNet needed
    synthetic_samples: 2048
    image_size: 256
    num_workers: 2
    prefetch_factor: 2
    pin_memory: False
    use_flip: False

model:
    model_str: pmfDiT_B_16
    cfg_beta: 1.0
    P_mean: 0.8
    P_std: 0.8
    noise_scale: 1.0

    lpips: False
    convnext: False

    cheb_order: 3
    deriv_mode: 'fd'        # 'fd' | 'jvp'
    fd_central: True
    fd_delta: 0.02          # TF32 matmul on GPU needs a larger delta than fp32
    reg_lambda: 0.0
    teacher_ema: False

training:
    log_per_step: 10
    checkpoint_per_epoch: 1
    num_epochs: 10
    batch_size: 32
    learning_rate: 0.001
    warmup_epochs: 0
    adam_b2: 0.95
    ema_type: 'edm'
    ema_val: [500, 1000, 2000]
    sample_per_epoch: 1
    fid_per_epoch: 100      # keep FID off during debugging
    seed: 42
    grad_clip_norm: 1.0

fid:
    device_batch_size: 4
    num_samples: 64
    cache_ref: ''

sampling:
    num_steps: 1
    omega: 8.5
    t_min: 0.1
    t_max: 0.7

logging:
    use_wandb: False
    wandb_project: 'YOUR PROJECT'
    wandb_entity: 'YOUR ENTITY'
    wandb_tags: []
    wandb_notes: ''

load_from: ''
